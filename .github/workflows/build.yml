# MSpanel build harness — PUBLIC repo, PRIVATE source.
#
# This repo holds NO application source. On trigger it clones the private
# Generis-Group/Agentic-OS repo (branch agent/secure-build) with a minimal read-only
# token, builds the Tauri desktop app for Windows + macOS, and uploads the
# UNSIGNED installers + updater bundles as Actions artifacts. The droplet
# pulls those artifacts, signs the updater bundles with the key that lives
# ONLY on the droplet, and publishes them to the panel download cache.
#
# SECURITY MODEL (do not weaken):
#   - Secrets in THIS repo: SOURCE_TOKEN (fine-grained PAT, Agentic-OS only,
#     Contents:READ only), GENERIS_DESKTOP_SECRET.
#     Nothing else. Never a broad/write token, never the updater signing key.
#   - The real updater signing key NEVER enters CI. Tauri refuses to build
#     with createUpdaterArtifacts and no key, so each run generates a
#     THROWAWAY key, and the .sig files it produces are NOT uploaded.
#   - Triggers are push/schedule/dispatch only. NEVER add pull_request or
#     pull_request_target (the latter exposes secrets to fork PRs).
#   - Every third-party action is pinned to a full commit SHA.
#   - No GitHub Release is published; artifacts are the only output.

name: build-harness

on:
  push:
    branches: ['main']
  schedule:
    # GitHub cron is UTC with no DST. Fire at both 03:00 and 04:00 UTC; the
    # gate job's DST guard lets through only the one that is 23:00 ET.
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-harness
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      src_sha: ${{ steps.decide.outputs.src_sha }}
    steps:
      # Clone the PRIVATE source (read-only token). The harness repo itself is
      # never checked out — there is nothing in it but this workflow.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Generis-Group/Agentic-OS
          ref: agent/secure-build
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
      - id: decide
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"

          # DST guard: only proceed on the nightly cron that is 23:00 in ET.
          if [ "$EVENT" = "schedule" ]; then
            HOUR="$(TZ=America/New_York date +%H)"
            if [ "$HOUR" != "23" ]; then
              echo "off-hour ($HOUR ET) — this cron is the wrong side of DST, skip"
              echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi

          BASE="$(node -p "require('./src-tauri/tauri.conf.json').version")"   # e.g. 0.20.0
          MAJMIN="$(echo "$BASE" | cut -d. -f1,2)"
          VER="${MAJMIN}.$(date +%Y%m%d)"   # 0.20.20260901 — strictly rising daily

          BUILD=true
          if [ "$EVENT" = "schedule" ]; then
            if [ -z "$(git log --since='24 hours ago' --oneline)" ]; then
              echo "no commits on the source in the last 24h — nothing new to build"
              BUILD=false
            fi
          fi
          echo "build=$BUILD"                    >> "$GITHUB_OUTPUT"
          echo "version=$VER"                    >> "$GITHUB_OUTPUT"
          echo "src_sha=$(git rev-parse HEAD)"   >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      # Build the EXACT commit the gate scanned.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Generis-Group/Agentic-OS
          ref: ${{ needs.gate.outputs.src_sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch 2026-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: ./src-tauri -> target

      - name: Stamp build version
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='${{ needs.gate.outputs.version }}';require('fs').writeFileSync(f, JSON.stringify(c,null,2)+'\n')"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # createUpdaterArtifacts:true makes `tauri build` REQUIRE a signing key.
      # The real key lives only on the droplet, so generate a THROWAWAY key for
      # this run; its .sig output is discarded (never uploaded). The droplet
      # re-signs the updater bundles with the real key.
      - name: Generate throwaway signing key
        shell: bash
        run: pnpm tauri signer generate -w "$RUNNER_TEMP/throwaway.key" --password ""

      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GENERIS_DESKTOP_SECRET: ${{ secrets.GENERIS_DESKTOP_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri build --bundles nsis

      - name: Build (macos)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GENERIS_DESKTOP_SECRET: ${{ secrets.GENERIS_DESKTOP_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        # Emits MSpanel.app + the updater bundle MSpanel.app.tar.gz (+ .sig).
        # The old mesh LaunchDaemon .pkg is gone with the mesh strip.
        run: pnpm tauri build --bundles app

      # Stage ONLY what the droplet needs. Explicitly NO .sig files — the
      # throwaway-key signatures must never leave the runner.
      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          echo "${{ needs.gate.outputs.version }}" > stage/version.txt
          echo "${{ needs.gate.outputs.src_sha }}" > stage/src_sha.txt
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/bundle/nsis/*-setup.exe stage/
          else
            cp target/release/bundle/macos/MSpanel.app.tar.gz stage/
          fi
          ls -la stage/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.os == 'windows-latest' && 'windows-bundle' || 'macos-bundle' }}
          path: stage/
          retention-days: 14
          if-no-files-found: error
