# MSpanel build harness — PUBLIC repo, PRIVATE source.
#
# This repo holds NO application source. On trigger it clones the private
# Generis-Group/Agentic-OS repo (branch agent/secure-build) with a minimal read-only
# token, builds the Tauri desktop app for Windows + macOS, and uploads the
# UNSIGNED installers + updater bundles as Actions artifacts. The droplet
# pulls those artifacts, signs the updater bundles with the key that lives
# ONLY on the droplet, and publishes them to the panel download cache.
#
# Two flavours per OS per run: SLIM (windows-bundle / macos-bundle, unchanged,
# feeds updater.json) and FAT (windows-bundle-fat / macos-bundle-fat, the
# website's Get-the-app installers). FAT artefacts carry the pinned local-brain
# runtime (scripts/runtime/pins.json in the source repo); every download is
# sha256-verified in CI and again by the app. First fat run: 34168511755.
# The macOS FAT artefact is a .dmg (drag to Applications, no admin password);
# the Windows FAT artefact is the NSIS setup exe. Since 0.28.0 (2026-09-08).
# Both macOS artefacts are ad-hoc SIGNED AND SEALED (bundle.macOS.signingIdentity
# "-" in the source's tauri.conf.json makes Tauri run Apple's codesign on the
# main binary and then the .app before it tars/dmgs it). A linker-signed-only
# bundle (no _CodeSignature) is what macOS 26 calls "damaged" on first open.
# Both mac legs gate on `codesign --verify --deep --strict` of the app inside
# the FINAL artefact (tar.gz / dmg), and the fat leg re-verifies the runtime
# manifest inside the sealed bundle. Since 0.29.0 (2026-09-08).
# A third, standalone leg (linux-wsl) builds GenerisBrain-linux-x64-wsl.tar.gz:
# the same pinned runtime for linux plus scripts/wsl/install.sh, for the
# website's "Windows + WSL2" install command. It builds no app, so it is not a
# matrix row; its flavor.txt says "wsl", not "fat". First linux-wsl run:
# 34199310751 - 4586 files / 561 MB unpacked, a 355 MB tarball, ~4 min, and the
# ldd sweep clean on 34 ELFs inside debian:trixie-slim. Note the leg needs no
# frontend or Rust build, so it stays green when an app leg does not.
#
# SECURITY MODEL (do not weaken):
#   - Secrets in THIS repo: SOURCE_TOKEN (fine-grained PAT, Agentic-OS only,
#     Contents:READ only), GENERIS_DESKTOP_SECRET.
#     Nothing else. Never a broad/write token, never the updater signing key.
#   - The real updater signing key NEVER enters CI. Tauri refuses to build
#     with createUpdaterArtifacts and no key, so each run generates a
#     THROWAWAY key, and the .sig files it produces are NOT uploaded.
#   - Triggers are push/schedule/dispatch only. NEVER add pull_request or
#     pull_request_target (the latter exposes secrets to fork PRs).
#   - Every third-party action is pinned to a full commit SHA.
#   - No GitHub Release is published; artifacts are the only output.

name: build-harness

on:
  push:
    branches: ['main']
  schedule:
    # GitHub cron is UTC with no DST. Fire at both 03:00 and 04:00 UTC; the
    # gate job's DST guard lets through only the one that is 23:00 ET.
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      fat:
        description: 'also build FAT installers'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-harness
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      fat: ${{ steps.decide.outputs.fat }}
      version: ${{ steps.decide.outputs.version }}
      src_sha: ${{ steps.decide.outputs.src_sha }}
    steps:
      # Clone the PRIVATE source (read-only token). The harness repo itself is
      # never checked out — there is nothing in it but this workflow.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Generis-Group/Agentic-OS
          ref: agent/secure-build
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
      - id: decide
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"

          # DST guard: only proceed on the nightly cron that is 23:00 in ET.
          if [ "$EVENT" = "schedule" ]; then
            HOUR="$(TZ=America/New_York date +%H)"
            if [ "$HOUR" != "23" ]; then
              echo "off-hour ($HOUR ET) — this cron is the wrong side of DST, skip"
              echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi

          BASE="$(node -p "require('./src-tauri/tauri.conf.json').version")"   # e.g. 0.20.0
          MAJMIN="$(echo "$BASE" | cut -d. -f1,2)"
          VER="${MAJMIN}.$(date +%Y%m%d)"   # 0.20.20260901 — strictly rising daily

          BUILD=true
          if [ "$EVENT" = "schedule" ]; then
            if [ -z "$(git log --since='24 hours ago' --oneline)" ]; then
              echo "no commits on the source in the last 24h — nothing new to build"
              BUILD=false
            fi
          fi

          # FAT legs: always on push and schedule; the dispatch input decides otherwise.
          FAT=true
          if [ "$EVENT" = "workflow_dispatch" ]; then
            FAT="${{ inputs.fat }}"
          fi
          echo "build=$BUILD"                    >> "$GITHUB_OUTPUT"
          echo "fat=$FAT"                        >> "$GITHUB_OUTPUT"
          echo "version=$VER"                    >> "$GITHUB_OUTPUT"
          echo "src_sha=$(git rev-parse HEAD)"   >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, flavor: slim }
          - { os: macos-latest,   flavor: slim }
          - { os: windows-latest, flavor: fat, rt_os: windows }
          - { os: macos-latest,   flavor: fat, rt_os: macos }
    runs-on: ${{ matrix.os }}
    steps:
      # Build the EXACT commit the gate scanned.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Generis-Group/Agentic-OS
          ref: ${{ needs.gate.outputs.src_sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch 2026-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: ./src-tauri -> target

      - name: Stamp build version
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='${{ needs.gate.outputs.version }}';require('fs').writeFileSync(f, JSON.stringify(c,null,2)+'\n')"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ---- FAT legs only: assemble the pinned local-brain runtime under
      # src-tauri/brain-runtime (Ollama subset + nomic-embed-text + Python +
      # memsom wheel). Every byte is pinned by URL + sha256 + size in the source
      # repo's scripts/runtime/pins.json and verified BEFORE extraction; the
      # tree is cached on the pins-file hash and re-verified after a restore.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.flavor == 'fat' && needs.gate.outputs.fat == 'true'
        with:
          python-version: '3.12'
      - name: Restore runtime cache
        if: matrix.flavor == 'fat' && needs.gate.outputs.fat == 'true'
        id: rtcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/brain-runtime
          key: brain-runtime-${{ matrix.rt_os }}-${{ hashFiles('scripts/runtime/pins.json') }}
      - name: Fetch runtime (pinned, sha256-verified)
        if: matrix.flavor == 'fat' && needs.gate.outputs.fat == 'true' && steps.rtcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python --version
          python scripts/runtime/fetch_runtime.py --os ${{ matrix.rt_os }} --out src-tauri/brain-runtime --cache "$RUNNER_TEMP/rt-dl"
      - name: Verify runtime tree
        if: matrix.flavor == 'fat' && needs.gate.outputs.fat == 'true'
        shell: bash
        run: python scripts/runtime/fetch_runtime.py --verify-only src-tauri/brain-runtime

      # createUpdaterArtifacts:true makes `tauri build` REQUIRE a signing key.
      # The real key lives only on the droplet, so generate a THROWAWAY key for
      # this run; its .sig output is discarded (never uploaded). The droplet
      # re-signs the updater bundles with the real key.
      - name: Generate throwaway signing key
        shell: bash
        run: pnpm tauri signer generate -w "$RUNNER_TEMP/throwaway.key" --password ""

      - name: Build (windows)
        if: matrix.os == 'windows-latest' && matrix.flavor == 'slim'
        shell: bash
        env:
          GENERIS_DESKTOP_SECRET: ${{ secrets.GENERIS_DESKTOP_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri build --bundles nsis

      - name: Build (macos)
        if: matrix.os == 'macos-latest' && matrix.flavor == 'slim'
        shell: bash
        env:
          GENERIS_DESKTOP_SECRET: ${{ secrets.GENERIS_DESKTOP_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        # Emits MSpanel.app + the updater bundle MSpanel.app.tar.gz (+ .sig).
        # The old mesh LaunchDaemon .pkg is gone with the mesh strip.
        run: pnpm tauri build --bundles app

      # HARD GATE: the updater artefact must carry a sealed ad-hoc signature.
      # Verified on the app extracted from the .app.tar.gz that ships, not on
      # the build dir. spctl is expected to say "rejected" (no Developer ID);
      # it is recorded, not gated.
      - name: Verify code signature (macos, slim)
        if: matrix.os == 'macos-latest' && matrix.flavor == 'slim'
        shell: bash
        run: |
          set -euo pipefail
          TGZ="$(ls target/release/bundle/macos/*.app.tar.gz)"
          X="$RUNNER_TEMP/sigcheck"; rm -rf "$X"; mkdir -p "$X"
          tar -xzf "$TGZ" -C "$X"
          APP="$X/Generis Brain.app"
          [ -d "$APP" ] || { echo "::error::$TGZ has no Generis Brain.app at its root"; ls -la "$X"; exit 1; }
          echo "== codesign --verify --deep --strict (extracted from $TGZ)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee "$RUNNER_TEMP/sig.txt" | grep -E "^(Identifier|CodeDirectory|Signature|Sealed)"
          grep -q "^Sealed Resources version=2" "$RUNNER_TEMP/sig.txt" || { echo "::error::no sealed resources in the updater app"; exit 1; }
          grep -q "linker-signed" "$RUNNER_TEMP/sig.txt" && { echo "::error::updater app is still linker-signed only"; exit 1; }
          echo "== spctl (informational; no Developer ID so 'rejected' is the expected verdict)"
          spctl --assess --type execute -vv "$APP" 2>&1 || echo "spctl rc=$? (recorded, not gated)"
          rm -rf "$X"

      # FAT builds merge src-tauri/tauri.fat.conf.json on top of the base
      # config: it adds bundle.resources = brain-runtime/, nothing else.
      - name: Build (windows, fat)
        if: matrix.os == 'windows-latest' && matrix.flavor == 'fat' && needs.gate.outputs.fat == 'true'
        shell: bash
        env:
          GENERIS_DESKTOP_SECRET: ${{ secrets.GENERIS_DESKTOP_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.fat.conf.json

      - name: Build (macos, fat)
        if: matrix.os == 'macos-latest' && matrix.flavor == 'fat' && needs.gate.outputs.fat == 'true'
        shell: bash
        env:
          GENERIS_DESKTOP_SECRET: ${{ secrets.GENERIS_DESKTOP_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        # The website's mac Get-the-app slot serves an ad-hoc-signed .dmg
        # (drag to Applications or ~/Applications — no admin password, which a
        # .pkg into /Applications needs; OQ-1). Tauri's dmg bundler first; if
        # it fails on the runner (Finder/AppleScript layout step), fall back to
        # a plain hdiutil image of the .app it already built. The log says which.
        run: |
          set -uo pipefail
          mkdir -p stage
          OUT="$PWD/stage/Generis Brain_${{ needs.gate.outputs.version }}_aarch64-fat.dmg"
          pnpm tauri build --bundles dmg --config src-tauri/tauri.fat.conf.json; rc=$?
          DMG="$(ls target/release/bundle/dmg/*.dmg 2>/dev/null | head -1 || true)"
          APP="target/release/bundle/macos/Generis Brain.app"
          if [ "$rc" -eq 0 ] && [ -n "$DMG" ]; then
            echo "dmg: tauri bundler ok -> $DMG"
            cp "$DMG" "$OUT"
          else
            echo "::warning::tauri dmg bundler failed (rc=$rc, dmg='$DMG') - falling back to hdiutil"
            [ -d "$APP" ] || { echo "no .app was built either"; exit 1; }
            rm -rf dmgroot && mkdir dmgroot
            ditto "$APP" "dmgroot/Generis Brain.app"
            ln -s /Applications dmgroot/Applications
            hdiutil create -volname "Generis Brain" -srcfolder dmgroot -ov -format UDZO "$OUT"
            echo "dmg: hdiutil fallback ok -> $OUT"
          fi
          hdiutil imageinfo "$OUT" | grep -E "Format:|Compressed Bytes|Total Bytes" || true
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier" || true

      # HARD GATE: the app inside the staged .dmg must verify sealed, and the
      # sealed bundle's brain-runtime must still match its manifest byte for
      # byte (the first-run seed refuses the payload otherwise). Sealing hashes
      # the runtime files; it must never rewrite them.
      - name: Verify code signature + runtime manifest (macos, fat)
        if: matrix.os == 'macos-latest' && matrix.flavor == 'fat' && needs.gate.outputs.fat == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(ls stage/*-fat.dmg)"
          MNT="$RUNNER_TEMP/dmgmnt"; mkdir -p "$MNT"
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$MNT" "$DMG" | tail -1
          APP="$MNT/Generis Brain.app"
          echo "== codesign --verify --deep --strict (inside $DMG)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee "$RUNNER_TEMP/sig.txt" | grep -E "^(Identifier|CodeDirectory|Signature|Sealed)"
          grep -q "^Sealed Resources version=2" "$RUNNER_TEMP/sig.txt" || { echo "::error::no sealed resources in the dmg app"; exit 1; }
          grep -q "linker-signed" "$RUNNER_TEMP/sig.txt" && { echo "::error::dmg app is still linker-signed only"; exit 1; }
          echo "== runtime manifest inside the sealed bundle"
          cmp "$APP/Contents/Resources/brain-runtime/manifest.json" src-tauri/brain-runtime/manifest.json
          python scripts/runtime/fetch_runtime.py --verify-only "$APP/Contents/Resources/brain-runtime"
          echo "== spctl (informational; no Developer ID so 'rejected' is the expected verdict)"
          spctl --assess --type execute -vv "$APP" 2>&1 || echo "spctl rc=$? (recorded, not gated)"

      # Stage ONLY what the droplet needs. Explicitly NO .sig files — the
      # throwaway-key signatures must never leave the runner.
      - name: Stage artifacts
        if: matrix.flavor == 'slim' || needs.gate.outputs.fat == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          VER="${{ needs.gate.outputs.version }}"
          echo "$VER" > stage/version.txt
          echo "${{ needs.gate.outputs.src_sha }}" > stage/src_sha.txt
          echo "${{ matrix.flavor }}" > stage/flavor.txt
          if [ "${{ matrix.flavor }}" = "slim" ]; then
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              cp target/release/bundle/nsis/*-setup.exe stage/
            else
              cp target/release/bundle/macos/*.app.tar.gz stage/
            fi
          else
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              cp target/release/bundle/nsis/*-setup.exe "stage/Generis Brain_${VER}_x64-fat-setup.exe"
            fi
            cp src-tauri/brain-runtime/manifest.json stage/runtime-manifest.json
            # A fat artefact under 200 MB means the runtime resources did not get in.
            python - <<'EOF'
          import glob, os, sys
          f = [p for p in glob.glob('stage/*') if p.endswith(('-fat-setup.exe', '-fat.dmg'))]
          assert f, 'no fat artefact staged'
          s = os.path.getsize(f[0]); print(f[0], s)
          sys.exit(0 if s > 200_000_000 else 1)
          EOF
          fi
          ls -la stage/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.flavor == 'slim' || needs.gate.outputs.fat == 'true'
        with:
          name: ${{ matrix.rt_os == 'windows' && 'windows-bundle-fat' || matrix.rt_os == 'macos' && 'macos-bundle-fat' || matrix.os == 'windows-latest' && 'windows-bundle' || 'macos-bundle' }}
          path: stage/
          retention-days: ${{ matrix.flavor == 'fat' && 3 || 14 }}
          if-no-files-found: error

  # ---- WSL2 runtime payload. NOT a Tauri build: a standalone job, deliberately
  # not a fifth row of the matrix above. Three reasons, all of them traps:
  #   * the artifact-name ternary at the end of `build` falls through to
  #     'macos-bundle' for an unhandled rt_os, so a new row would upload as the
  #     mac slim artefact and clobber it - green CI, wrong bytes on the droplet;
  #   * the 200 MB stage gate globs only -fat-setup.exe / -fat.dmg and asserts
  #     on anything else, so a .tar.gz would fail it;
  #   * building src-tauri on Linux would need webkit2gtk, and this leg does not
  #     build an app at all - it ships a runtime payload and an installer script.
  # flavor.txt says "wsl", not "fat", so this artefact is structurally unable to
  # satisfy or disturb the pull script's windows-AND-mac fat publishing gate.
  linux-wsl:
    needs: gate
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.fat == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Generis-Group/Agentic-OS
          ref: ${{ needs.gate.outputs.src_sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Restore runtime cache
        id: rtcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: brain-runtime
          key: brain-runtime-linux-wsl-${{ hashFiles('scripts/runtime/pins.json') }}

      # The linux Ollama asset is a 1.4 GB .tar.zst; fetch_runtime shells out to
      # zstd for it, so fail here and loudly if the runner ever loses the tool.
      - name: Fetch runtime (pinned, sha256-verified)
        if: steps.rtcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python --version
          zstd --version
          df -h / | tail -1
          python scripts/runtime/fetch_runtime.py --os linux --out brain-runtime --cache "$RUNNER_TEMP/rt-dl"

      # The target is a 181-package Debian trixie rootfs with no libgomp.so.1 and
      # a password-gated sudo, so anything the runners resolve for free has to be
      # carried in the payload. Both container steps use debian:trixie-slim
      # because the runner's own Ubuntu image would mask exactly what we are
      # looking for.
      - name: Vendor libraries a bare Debian trixie cannot resolve
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/brain-runtime:/payload" -v "$PWD/scripts/wsl:/scripts:ro" \
            debian:trixie-slim bash /scripts/vendor_libs.sh /payload
          sudo chown -R "$(id -u):$(id -g)" brain-runtime

      - name: Rebuild the manifest over the vendored tree
        run: python scripts/runtime/fetch_runtime.py --manifest-only brain-runtime --os linux

      - name: ldd sweep on a clean Debian trixie
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/brain-runtime:/payload:ro" -v "$PWD/scripts/wsl:/scripts:ro" \
            debian:trixie-slim bash /scripts/ldd_sweep.sh /payload

      # Runs on a cache hit too: a restored tree is re-hashed before it ships.
      - name: Verify runtime tree
        run: python scripts/runtime/fetch_runtime.py --verify-only brain-runtime

      # The launchers install.sh writes into ~/.generis-brain/bin are the hot
      # path -- ollama-up runs on every memsom MCP spawn and every memsom hook
      # spawn -- so they get their own gate, inside the target rootfs where /proc
      # and the pid allocator behave like the user's distro rather than the
      # runner's. The tests extract the launcher bodies out of install.sh itself,
      # so a rename or a rewrite fails here instead of on a user's machine after
      # their next `wsl --shutdown`.
      - name: Launcher regression tests (Debian trixie)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/scripts/wsl:/scripts:ro" debian:trixie-slim \
            bash /scripts/test_launchers.sh /scripts/install.sh

      # The release-feed parser inside generis-brain-update is the only thing
      # between a GitHub feed and a pip install on a user's machine. Runs on the
      # runner's python rather than in the container, because trixie-slim has no
      # python3 - which is the whole reason the payload ships its own.
      - name: Updater feed-parser tests
        run: python scripts/wsl/test_update_feed.py

      - name: Assemble the tarball tree
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist/generis-brain-wsl
          cp -a brain-runtime/. dist/generis-brain-wsl/
          cp scripts/wsl/install.sh dist/generis-brain-wsl/install.sh
          chmod 0755 dist/generis-brain-wsl/install.sh
          echo "${{ needs.gate.outputs.version }}" > dist/generis-brain-wsl/VERSION
          ls -la dist/generis-brain-wsl

      - name: Pack and floor-check
        run: |
          set -euo pipefail
          tar czf dist/GenerisBrain-linux-x64-wsl.tar.gz -C dist generis-brain-wsl
          s="$(stat -c%s dist/GenerisBrain-linux-x64-wsl.tar.gz)"
          echo "tarball: $s bytes"
          [ "$s" -gt 200000000 ] || { echo "::error::wsl tarball under the 200 MB floor - the runtime did not get in"; exit 1; }
          echo wsl > dist/flavor.txt
          echo "${{ needs.gate.outputs.version }}" > dist/version.txt
          echo "${{ needs.gate.outputs.src_sha }}" > dist/src_sha.txt
          cp brain-runtime/manifest.json dist/runtime-manifest.json
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-wsl-bundle
          path: |
            dist/GenerisBrain-linux-x64-wsl.tar.gz
            dist/flavor.txt
            dist/version.txt
            dist/src_sha.txt
            dist/runtime-manifest.json
          retention-days: 3
          if-no-files-found: error
