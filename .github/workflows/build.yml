# MSpanel build harness — PUBLIC repo, PRIVATE source.
#
# This repo holds NO application source. On trigger it clones the private
# Generis-Group/Agentic-OS repo (branch app-updater) with a minimal read-only
# token, builds the Tauri desktop app for Windows + macOS, and uploads the
# UNSIGNED installers + updater bundles as Actions artifacts. The droplet
# pulls those artifacts, signs the updater bundles with the key that lives
# ONLY on the droplet, and publishes them to the panel download cache.
#
# SECURITY MODEL (do not weaken):
#   - Secrets in THIS repo: SOURCE_TOKEN (fine-grained PAT, Agentic-OS only,
#     Contents:READ only), GENERIS_DESKTOP_SECRET, GENERIS_MESH_ENDPOINTS.
#     Nothing else. Never a broad/write token, never the updater signing key.
#   - The real updater signing key NEVER enters CI. Tauri refuses to build
#     with createUpdaterArtifacts and no key, so each run generates a
#     THROWAWAY key, and the .sig files it produces are NOT uploaded.
#   - Triggers are push/schedule/dispatch only. NEVER add pull_request or
#     pull_request_target (the latter exposes secrets to fork PRs).
#   - Every third-party action is pinned to a full commit SHA.
#   - No GitHub Release is published; artifacts are the only output.

name: build-harness

on:
  push:
    branches: ['main']
  schedule:
    # GitHub cron is UTC with no DST. Fire at both 03:00 and 04:00 UTC; the
    # gate job's DST guard lets through only the one that is 23:00 ET.
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-harness
  cancel-in-progress: false

env:
  NEBULA_VERSION: '1.10.3'

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      src_sha: ${{ steps.decide.outputs.src_sha }}
    steps:
      # Clone the PRIVATE source (read-only token). The harness repo itself is
      # never checked out — there is nothing in it but this workflow.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Generis-Group/Agentic-OS
          ref: app-updater
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      # Same author-identifying-token scan the source repo gates on — a build
      # must not ship a username / mesh IP / machine path.
      - name: Author-identifying token scan
        run: python scripts/scrub_gate.py
      - id: decide
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"

          # DST guard: only proceed on the nightly cron that is 23:00 in ET.
          if [ "$EVENT" = "schedule" ]; then
            HOUR="$(TZ=America/New_York date +%H)"
            if [ "$HOUR" != "23" ]; then
              echo "off-hour ($HOUR ET) — this cron is the wrong side of DST, skip"
              echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi

          BASE="$(node -p "require('./src-tauri/tauri.conf.json').version")"   # e.g. 0.20.0
          MAJMIN="$(echo "$BASE" | cut -d. -f1,2)"
          VER="${MAJMIN}.$(date +%Y%m%d)"   # 0.20.20260901 — strictly rising daily

          BUILD=true
          if [ "$EVENT" = "schedule" ]; then
            if [ -z "$(git log --since='24 hours ago' --oneline)" ]; then
              echo "no commits on the source in the last 24h — nothing new to build"
              BUILD=false
            fi
          fi
          echo "build=$BUILD"                    >> "$GITHUB_OUTPUT"
          echo "version=$VER"                    >> "$GITHUB_OUTPUT"
          echo "src_sha=$(git rev-parse HEAD)"   >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            neb_asset: nebula-windows-amd64.zip
          - os: macos-latest
            neb_asset: nebula-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      # Build the EXACT commit the gate scanned.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Generis-Group/Agentic-OS
          ref: ${{ needs.gate.outputs.src_sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch 2026-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: ./src-tauri -> target

      # The nebula daemon + nebula-cert + wintun are gitignored (vendored, ~90MB),
      # so CI pulls them from the pinned slackhq/nebula release into the exact
      # paths the bundle expects (externalBin binaries/nebula-cert + resources/).
      - name: Fetch vendored nebula binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries src-tauri/resources/mac src-tauri/resources/win
          url="https://github.com/slackhq/nebula/releases/download/v${NEBULA_VERSION}/${{ matrix.neb_asset }}"
          curl -fsSL -o neb.pkg "$url"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            tar -xzf neb.pkg
            cp nebula      src-tauri/resources/mac/nebula
            # nebula's darwin build is a universal binary — same file for both triples
            cp nebula-cert src-tauri/binaries/nebula-cert-aarch64-apple-darwin
            cp nebula-cert src-tauri/binaries/nebula-cert-x86_64-apple-darwin
            chmod +x src-tauri/resources/mac/nebula src-tauri/binaries/nebula-cert-*-apple-darwin
          else
            7z x -oneb neb.pkg
            cp neb/nebula.exe      src-tauri/resources/win/nebula.exe
            cp neb/nebula-cert.exe src-tauri/binaries/nebula-cert-x86_64-pc-windows-msvc.exe
            find neb -iname wintun.dll -path '*amd64*' -print -exec cp {} src-tauri/resources/win/wintun.dll \;
          fi

      # scripts/inject-vite-mesh-base.mjs (beforeBuildCommand) reads
      # ~/.generis_mesh_endpoints (KEY=VALUE lines) — verified in source.
      - name: Provide mesh endpoints
        shell: bash
        env:
          GENERIS_MESH_ENDPOINTS: ${{ secrets.GENERIS_MESH_ENDPOINTS }}
        run: printf '%s\n' "$GENERIS_MESH_ENDPOINTS" > "$HOME/.generis_mesh_endpoints"

      - name: Stamp build version
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='${{ needs.gate.outputs.version }}';require('fs').writeFileSync(f, JSON.stringify(c,null,2)+'\n')"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # createUpdaterArtifacts:true makes `tauri build` REQUIRE a signing key.
      # The real key lives only on the droplet, so generate a THROWAWAY key for
      # this run; its .sig output is discarded (never uploaded). The droplet
      # re-signs the updater bundles with the real key.
      - name: Generate throwaway signing key
        shell: bash
        run: pnpm tauri signer generate -w "$RUNNER_TEMP/throwaway.key" --password ""

      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GENERIS_DESKTOP_SECRET: ${{ secrets.GENERIS_DESKTOP_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri build --bundles nsis

      - name: Build (macos)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GENERIS_DESKTOP_SECRET: ${{ secrets.GENERIS_DESKTOP_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri build --bundles app

      # The fresh-install macOS .pkg (mesh LaunchDaemon + app) is built by a
      # custom script, NOT tauri build (which emits .app + updater .app.tar.gz).
      - name: Build macOS .pkg installer
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GENERIS_DESKTOP_SECRET: ${{ secrets.GENERIS_DESKTOP_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Desktop"
          chmod +x src-tauri/binaries/nebula-cert-*-apple-darwin src-tauri/installer/mac/*.sh src-tauri/resources/mac/nebula || true
          # ensure the bundled cert stays executable (the +x-strip class of bug)
          chmod +x "target/release/bundle/macos/MSpanel.app/Contents/MacOS/nebula-cert" || true
          chmod +x "src-tauri/target/release/bundle/macos/MSpanel.app/Contents/MacOS/nebula-cert" || true
          bash src-tauri/installer/mac/build-pkg-unsigned.sh

      # Stage ONLY what the droplet needs. Explicitly NO .sig files — the
      # throwaway-key signatures must never leave the runner.
      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          echo "${{ needs.gate.outputs.version }}" > stage/version.txt
          echo "${{ needs.gate.outputs.src_sha }}" > stage/src_sha.txt
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp src-tauri/target/release/bundle/nsis/*-setup.exe stage/
          else
            cp src-tauri/target/release/bundle/macos/MSpanel.app.tar.gz stage/
            cp "$HOME/Desktop/GenerisBrain-Installer-unsigned.pkg" stage/MSpanel-macos.pkg
          fi
          ls -la stage/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.os == 'windows-latest' && 'windows-bundle' || 'macos-bundle' }}
          path: stage/
          retention-days: 14
          if-no-files-found: error
